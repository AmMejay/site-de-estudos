<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css" />

  <body>
    <div class="alincont">
      <div class="container">
        <form action="">
          <h1>LOGIN</h1>
          <br />
          <label for="nm">Nome</label>
          <br />
          <input type="text" name="nm" id="nm" />
          <br /><br />
          <label for="sn">Senha</label>
          <br />
          <input type="password" name="sn" id="sn" />
          <br /><br /><br />
          <button id="bot">LOGIN</button>
          <br />
          <br />
          <div class="ng">
            Não tem login? <u>Cadastre-se</u>
            <br />
          </div>
          <div id="erro"></div>
        </form>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
